name: Rust obfuscation toolchain

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: rust-obfuscation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native Rust 1.99 and extracted artifact (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      CARGO_HOME: ${{ github.workspace }}/build-rust-1.99/build/obfuscation-cargo-home
      # Remap the CI workspace out of every cargo compilation in this job
      # (the bootstrap-built host std in particular), so produced binaries
      # carry /rustc/<commit>/... paths instead of the runner's layout.
      # Steps that need their own flag sets (the build-std std step)
      # override RUSTFLAGS explicitly.
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}/build-rust-1.99=/rustc/b940084d7eb6a299eb4bfeb8e34901bc051e7ac4
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
            target: X86
            exe: ''
            extension: tar.gz
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            host: aarch64-unknown-linux-gnu
            target: AArch64
            exe: ''
            extension: tar.gz
          - platform: macos-arm64
            runner: macos-15
            host: aarch64-apple-darwin
            target: AArch64
            exe: ''
            extension: tar.gz
          - platform: windows-amd64
            runner: windows-2022
            host: x86_64-pc-windows-msvc
            target: X86
            exe: '.exe'
            extension: zip

    steps:
      - uses: actions/checkout@v7
        with:
          # bootstrap.py verifies ancestry from the pinned LLVM base commit.
          # Full commit history keeps the proof valid as this branch grows.
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Reclaim unused Linux runner disk
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Linux build and HTTPS dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ xz-utils pkg-config openssl libcurl4-openssl-dev libssl-dev libobjc-13-dev gcc-mingw-w64-x86-64 gcc-mingw-w64-i686

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ninja mingw-w64

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0

      - name: Install Windows build and HTTPS dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'ninja installation failed' }
          # mingw gcc is needed to build the windows-gnu std C sources
          # (library/unwind) in the cross-target std step
          choco install mingw -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'mingw installation failed' }
          & (Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe') install curl:x64-windows
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg curl installation failed' }
          $prefix = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\x64-windows'
          $libDir = Join-Path $prefix 'lib'
          $binDir = Join-Path $prefix 'bin'
          $ffiDir = Join-Path $PWD.Path 'build-llvm-project\ffi-libs'
          New-Item -ItemType Directory -Force -Path $ffiDir | Out-Null
          Copy-Item (Join-Path $libDir 'libcurl.lib') (Join-Path $ffiDir 'curl.lib')
          "LIB=$ffiDir;$libDir;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Configure assertions-enabled LLVM and Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S llvm -B build-llvm-project -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLVM_ENABLE_ASSERTIONS=ON -DLLVM_ENABLE_PROJECTS=clang -DLLVM_TARGETS_TO_BUILD=all -DLLVM_INCLUDE_TESTS=ON -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_ENABLE_TERMINFO=OFF -DLLVM_ENABLE_ZSTD=OFF -DLLVM_ENABLE_ZLIB=OFF -DLLVM_ENABLE_LIBXML2=OFF -DLLVM_PARALLEL_LINK_JOBS=1

      - name: Configure assertions-enabled LLVM and Clang (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S llvm -B build-llvm-project -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -DLLVM_ENABLE_ASSERTIONS=ON -DLLVM_ENABLE_PROJECTS=clang -DLLVM_TARGETS_TO_BUILD=all -DLLVM_INCLUDE_TESTS=ON -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_ENABLE_TERMINFO=OFF -DLLVM_ENABLE_ZSTD=OFF -DLLVM_ENABLE_ZLIB=OFF -DLLVM_ENABLE_LIBXML2=OFF -DLLVM_PARALLEL_LINK_JOBS=1

      - name: Configure assertions-enabled LLVM and Clang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Match the static MSVC CRT used by Rust 1.99's own LLVM build.
          cmake -S llvm -B build-llvm-project -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DLLVM_ENABLE_ASSERTIONS=ON -DLLVM_ENABLE_PROJECTS=clang -DLLVM_TARGETS_TO_BUILD=all -DLLVM_INCLUDE_TESTS=ON -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_ENABLE_TERMINFO=OFF -DLLVM_ENABLE_ZSTD=OFF -DLLVM_ENABLE_ZLIB=OFF -DLLVM_ENABLE_LIBXML2=OFF -DLLVM_PARALLEL_LINK_JOBS=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build LLVM tools and obfuscation unit tests
        run: cmake --build build-llvm-project --target clang opt llvm-objdump llvm-config ObfuscationTests --parallel 4

      - name: Check LLVM obfuscation unit tests
        run: python -c "import subprocess; subprocess.run(['build-llvm-project/unittests/Transforms/Obfuscation/ObfuscationTests${{ matrix.exe }}'], check=True)"

      - name: Check Rust bootstrap and delivery unit tests
        run: python -B -m unittest discover -s tools/rust-obfuscation -p 'test_*.py' -v

      - name: Check isolated final machine-code extraction
        run: python -B tests/obfuscation/rust/test_machine_code.py

      - name: Fetch pinned Rust 1.99 source
        run: |
          git clone --depth 1 --branch 1.99.0 --filter=blob:none https://github.com/rust-lang/rust.git build-rust-1.99
          # The path remaps below point at this exact upstream commit: it
          # makes the sysroot's embedded panic locations read as
          # /rustc/<commit>/library/... exactly like official rust builds
          # (a release-version path would be a custom-toolchain tell).
          # The commit is pinned in bootstrap.RUST_SRC_COMMIT; fail fast
          # if the tag moved or the clone went wrong.
          expected="$(python -B -c "import sys; sys.path.insert(0, 'tools/rust-obfuscation'); import bootstrap; print(bootstrap.RUST_SRC_COMMIT)")"
          actual="$(git -C build-rust-1.99 rev-parse HEAD)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::rust 1.99.0 checkout is $actual, expected $expected"
            exit 1
          fi

      # Remap the CI workspace out of the sysroot's panic locations at the
      # CARGO level: the bootstrap's own flag plumbing does not extend into
      # the cargo-compiled std dependency units (addr2line, gimli, ...),
      # whose source paths otherwise leak the runner's workspace layout
      # into every payload that links the prebuilt std. Cargo reads
      # $CARGO_HOME/config.toml for every invocation in this job.
      - name: Write cargo-level sysroot path remap
        shell: bash
        run: |
          WS="$GITHUB_WORKSPACE"
          if command -v cygpath >/dev/null 2>&1; then WS="$(cygpath -m "$WS")"; fi
          mkdir -p "${CARGO_HOME}"
          cat > "${CARGO_HOME}/config.toml" << EOF
          [build]
          rustflags = ["--remap-path-prefix=$WS/build-rust-1.99=/rustc/b940084d7eb6a299eb4bfeb8e34901bc051e7ac4"]
          EOF

      - name: Build pinned stage-1 Rust compiler and sysroot
        run: python -B tools/rust-obfuscation/bootstrap.py build --jobs 4

      - name: Build cross-target std into the sysroot
        shell: bash
        run: |
          set -euo pipefail
          # Keep the real MSVC linker ahead of git-bash's /usr/bin/link.exe
          # (the coreutils file-creation tool) which otherwise shadows it
          # when linking host build-script binaries.
          if command -v cygpath >/dev/null 2>&1 && [ -n "${VCToolsInstallDir:-}" ]; then
            export PATH="$(cygpath -u "$VCToolsInstallDir")bin/HostX64/x64:$PATH"
          fi
          # bootstrap.py already links $STAGE1/lib/rustlib/src/rust to the
          # rust source checkout, so build-std finds the library sources
          # through that symlink. Do NOT copy or mkdir into rustlib/src:
          # following the symlink would pollute the source tree and fail
          # packaging provenance.
          STAGE1="$(pwd)/build-rust-1.99/build/${{ matrix.host }}/stage1"
          # Minimal lib-only crate: compiles std rlibs without invoking a
          # linker. The fat LTO profile makes cargo embed LLVM bitcode into
          # the std rlibs (matching what downstream release profiles with
          # `lto = "fat"` - which LTO against std - require).
          mkdir -p /tmp/stdbuild/src
          printf '[package]\nname = "stdseed"\nversion = "0.1.0"\nedition = "2021"\n\n[profile.release]\nlto = "fat"\n' > /tmp/stdbuild/Cargo.toml
          echo 'pub fn seed() {}' > /tmp/stdbuild/src/lib.rs
          export RUSTC_BOOTSTRAP=1
          export RUSTC="$STAGE1/bin/rustc${{ matrix.exe }}"
          # Remap the CI build tree out of the sysroot's panic locations so
          # downstream binaries do not reveal the build environment. rustc
          # applies remaps sequentially (each rewrites the path if the
          # current value matches), so a catch-all rule would pre-empt the
          # specific ones - only non-overlapping specific rules are used.
          # Remapped paths mimic official rust std
          # (/rustc/<commit>/library/... and a vendor tree).
          WS="$GITHUB_WORKSPACE"
          if command -v cygpath >/dev/null 2>&1; then WS="$(cygpath -m "$WS")"; fi
          export RUSTFLAGS="--remap-path-prefix=$WS/build-rust-1.99/build/obfuscation-cargo-home=/rustc/b940084d7eb6a299eb4bfeb8e34901bc051e7ac4/vendor --remap-path-prefix=$WS/build-rust-1.99/build/${{ matrix.host }}/stage1/lib/rustlib/src/rust=/rustc/b940084d7eb6a299eb4bfeb8e34901bc051e7ac4 --remap-path-prefix=$WS/build-rust-1.99/library=/rustc/b940084d7eb6a299eb4bfeb8e34901bc051e7ac4/library"
          # On Windows the runner's bash is msys: $(pwd) yields /c/-style
          # paths that native cargo cannot execute. Convert to a Windows
          # path; on Linux/macOS cygpath does not exist and this is a no-op.
          if command -v cygpath >/dev/null 2>&1; then
            export RUSTC="$(cygpath -w "$RUSTC")"
          fi
          cd /tmp/stdbuild
          for triple in \
            x86_64-unknown-linux-gnu x86_64-unknown-linux-musl \
            i686-unknown-linux-gnu i686-unknown-linux-musl \
            aarch64-unknown-linux-gnu aarch64-unknown-linux-musl \
            armv7-unknown-linux-gnueabihf armv7-unknown-linux-musleabihf \
            x86_64-pc-windows-gnu i686-pc-windows-gnu aarch64-pc-windows-gnullvm \
            x86_64-apple-darwin aarch64-apple-darwin ; do
            if [ "$triple" = "${{ matrix.host }}" ]; then
              # The host triple's std ships with the bootstrap sysroot; a
              # second build-std copy would leave two libstd candidates in
              # the sysroot and break linking entirely
              continue
            fi
            if cargo build --release --target "$triple" -Z build-std=std,panic_abort; then
              mkdir -p "$STAGE1/lib/rustlib/$triple/lib"
              cp target/"$triple"/release/deps/lib*.rlib "$STAGE1/lib/rustlib/$triple/lib/"
              cp target/"$triple"/release/deps/lib*.rmeta "$STAGE1/lib/rustlib/$triple/lib/" || true
              rm -f "$STAGE1/lib/rustlib/$triple/lib/"libstdseed-*
              echo "OK: $triple"
            else
              echo "::error::std build failed for $triple"
            fi
          done
          # The stage record's outputs inventory was written by bootstrap.py
          # before this step intentionally extended the sysroot with the
          # cross-target std libraries. Refresh it with the same hashing
          # code packaging uses, or package.py's verify_stage() rejects the
          # tree. Source identity, LLVM tool hashes and the rust source
          # commit checks are untouched and still bind.
          cd "$GITHUB_WORKSPACE"
          python - <<'PYEOF'
          import json, pathlib, sys
          sys.path.insert(0, "tools/rust-obfuscation")
          import provenance

          stage = pathlib.Path("build-rust-1.99/build/${{ matrix.host }}/stage1")
          record = json.loads((stage / provenance.STAGE_RECORD).read_text())
          record["outputs"] = provenance.stage_inventory(stage)
          provenance.write_record(stage / provenance.STAGE_RECORD, record)
          print("stage record refreshed:", len(record["outputs"]), "files inventoried")
          PYEOF


      - name: Build Cargo launcher from its lockfile
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/build-llvm-project/cargo-wrapper-target
        run: python -B tools/rust-obfuscation/provenance.py build-wrapper --target-dir build-llvm-project/cargo-wrapper-target

      - name: Check Cargo launcher unit tests
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/build-llvm-project/cargo-wrapper-target
        run: cargo test --locked --manifest-path tools/rust-obfuscation/cargo-wrapper/Cargo.toml

      - name: Verify LLVM obfuscation pipeline
        run: python -B tests/obfuscation/rust/test_pipeline.py --opt build-llvm-project/bin/opt${{ matrix.exe }} --clang build-llvm-project/bin/clang${{ matrix.exe }}

      - name: Verify native and cross-target EH IR
        run: python -B tests/obfuscation/test_eh_regions.py --clang build-llvm-project/bin/clang${{ matrix.exe }} --opt build-llvm-project/bin/opt${{ matrix.exe }} --work-dir build-llvm-project/eh-ir

      - name: Package pinned native Rust toolchain
        run: python -B tools/rust-obfuscation/package.py --stage1 build-rust-1.99/build/${{ matrix.host }}/stage1 --rust-source build-rust-1.99 --wrapper build-llvm-project/cargo-wrapper-target/release/rust-obf-cargo${{ matrix.exe }} --opt build-llvm-project/bin/opt${{ matrix.exe }} --objdump build-llvm-project/bin/llvm-objdump${{ matrix.exe }} --output build-llvm-project/rust-obfuscation-${{ matrix.platform }}.${{ matrix.extension }}

      - name: Verify extracted toolchain, HTTPS, Cargo, EH, and cost
        run: python -B tools/rust-obfuscation/verify_package.py --archive build-llvm-project/rust-obfuscation-${{ matrix.platform }}.${{ matrix.extension }} --work-dir build-llvm-project/rust-extracted --expected-commit ${{ github.sha }} --full --clang build-llvm-project/bin/clang${{ matrix.exe }} --online --live-https --benchmark

      - name: Verify portable Clang obfuscation suites
        run: python -B tests/obfuscation/run_portable.py --clang build-llvm-project/bin/clang${{ matrix.exe }} --opt build-llvm-project/bin/opt${{ matrix.exe }} --objdump build-llvm-project/bin/llvm-objdump${{ matrix.exe }} --work-dir build-llvm-project/portable-rust

      - name: Measure each Clang obfuscation pass from final binaries
        run: python -B tests/obfuscation/report_size_time.py --clang build-llvm-project/bin/clang${{ matrix.exe }} --opt build-llvm-project/bin/opt${{ matrix.exe }} --objdump build-llvm-project/bin/llvm-objdump${{ matrix.exe }} --work-dir build-llvm-project/clang-cost

      - name: Verify four-language HTTPS clients on Linux
        if: runner.os == 'Linux'
        run: python -B tests/obfuscation/test_http_programs.py --clang build-llvm-project/bin/clang --opt build-llvm-project/bin/opt --work-dir build-llvm-project/http-rust

      - name: Upload passing native toolchain archive
        uses: actions/upload-artifact@v7
        with:
          name: rust-obfuscation-${{ matrix.platform }}
          path: |
            build-llvm-project/rust-obfuscation-${{ matrix.platform }}.${{ matrix.extension }}
            build-llvm-project/rust-obfuscation-${{ matrix.platform }}.${{ matrix.extension }}.sha256
            build-llvm-project/rust-extracted/smoke-report.json
            build-llvm-project/rust-extracted/benchmark/benchmark-report.json
            build-llvm-project/clang-cost/obfuscation-performance.json
            build-llvm-project/clang-cost/obfuscation-performance.md
            build-llvm-project/portable-rust/report_static_recovery/static-recovery.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Rust diagnostic reports and emitted IR
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rust-obfuscation-diagnostics-${{ matrix.platform }}
          path: |
            build-llvm-project/rust-extracted/**/*.json
            build-llvm-project/rust-extracted/**/*.ll
            build-llvm-project/eh-ir/*.ll
            build-llvm-project/portable-rust/**/*.ll
            build-llvm-project/portable-rust/**/*.json
            build-llvm-project/clang-cost/**
            build-llvm-project/http-rust/*.ll
          if-no-files-found: ignore
